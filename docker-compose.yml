services:
  geosignal:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      GEOSIGNAL_BIND: 0.0.0.0
      GEOSIGNAL_DATA: /data
      GEOSIGNAL_PUBLIC: "1"
      PORT: "7860"
    volumes:
      - ./data:/data
    restart: unless-stopped
