[package]
name = "geosignal"
version = "1.0.0"
edition = "2021"
description = "Local-first geo / local SEO auditor with a small-model AI lab"
license = "MIT"

[[bin]]
name = "geosignal"
path = "src/main.rs"

[[bin]]
name = "geosignal-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tao", "dep:wry"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
url = "2"
llama-cpp-2 = "0.1.161"
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }

[profile.release]
opt-level = 2
